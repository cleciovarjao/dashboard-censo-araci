name: Assemble index.html from compressed payload
on:
  push:
    paths:
      - 'payload/**'
      - '.github/workflows/assemble-from-b64.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and gunzip into index.html
        run: |
          set -euo pipefail
          cat payload/p00.txt payload/p01.txt payload/p02.txt | base64 -d | gunzip -c > index.html
          wc -c index.html
          sha256sum index.html
          test "$(wc -c < index.html)" -eq 41993
          test "$(sha256sum index.html | awk '{print $1}')" = "e89e72ebca947a2a42ef666c259ce8212c06996e9a546d9639d6148ee123121e"
      - name: Commit index.html
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git commit -m "Painel lista ponderações: comum × ponderadas"
          git push
