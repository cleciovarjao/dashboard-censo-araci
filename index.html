<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Araci 2026 — Lista de ponderações Fundeb (VAAF)</title>
</head>
<body>
<p id="status">Carregando painel…</p>
<!-- Subtotal do bloco -->
<script>
(async () => {
  try {
    const n = 5;
    const parts = [];
    for (let i = 0; i < n; i++) {
      const r = await fetch('./assets/lista-part-' + i + '.txt', {cache:'no-cache'});
      if (!r.ok) throw new Error('part ' + i + ' HTTP ' + r.status);
      parts.push(await r.text());
    }
    const html = parts.join('');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('status').textContent = 'Falha ao carregar: ' + e;
  }
})();
</script>
</body>
</html>
